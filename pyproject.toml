[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-admission-assignment"
version = "0.1.0"
description = "GitHub Repository Summarizer using LLM APIs"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "openai==1.30.1",
    "anthropic==0.28.0",
    "google-generativeai==0.7.0",
]
